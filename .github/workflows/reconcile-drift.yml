name: Reconcile held drift fixes

# The hands-off merger. The development watcher (upstream-watch.yml) has the agent prepare
# fixes for upstream drift as HELD pull requests (branch auto/drift-*). This workflow is what
# merges them FOR you — you never touch a PR.
#
# Every 6 hours (and on demand), for each held drift PR it re-tests that PR's patch against the
# CURRENT upstream main. The moment a prepared fix is proven correct for production main, it
# merges the PR and kicks the publish build — which re-runs the full gauntlet (image, smoke,
# boot) before anything reaches :latest, so a wrong fix can never be published. Fixes that
# aren't yet valid against main (his release hasn't caught up to that development change) are
# left held and retried next cycle.
#
# It merges at most one PR per run (the next run takes the next), and shares build.yml's
# concurrency group so it can never race a publish.

on:
  schedule:
    - cron: "45 */6 * * *"   # every 6h, offset from the build + development watchers
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: kineticman/FastChannels
  UPSTREAM_BRANCH: main

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5
        with:
          path: overlay
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge any held fix that's now valid against main
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openrouter/z-ai/glm-5.3-flash' }}
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/$UPSTREAM_REPO.git" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          [ -n "$sha" ] || { echo "::error::could not read upstream $UPSTREAM_BRANCH"; exit 1; }
          echo "Upstream $UPSTREAM_BRANCH HEAD: $sha"

          # Check the cache of held fixes (shared with the build's cache step): the first held PR
          # whose patches still apply + validate against main is the one to promote. Each held PR
          # is a full patch set, so newest = most cumulative.
          pip install --quiet ruff jinja2
          num=$(overlay/scripts/try_held_fixes.sh overlay "$UPSTREAM_REPO" "$sha" | tail -1)
          if [ -n "$num" ]; then
            echo "Held fix PR #$num is valid against main $sha — merging and publishing (the publish build re-runs the full gauntlet, and dedups by build key so it can't over-build)."
            gh pr merge "$num" -R "$GITHUB_REPOSITORY" --squash --delete-branch
            # Pushes with GITHUB_TOKEN don't trigger workflows, so kick the publish build.
            gh workflow run build.yml --repo "$GITHUB_REPOSITORY"
          else
            echo "No held fix is valid against main yet; nothing merged."
          fi

      - name: Delete auto-fix branches with no open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The AI paths create auto/drift-* and auto/port-* branches; once their PR is merged
          # or closed the branch lingers. Sweep any auto/* branch that has no open PR so the
          # repo stays tidy without manual cleanup.
          open=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --json headRefName --jq '.[].headRefName')
          for b in $(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | grep -E '^auto/' || true); do
            printf '%s\n' "$open" | grep -qxF "$b" && continue
            echo "deleting orphan branch $b"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b" >/dev/null 2>&1 || true
          done
