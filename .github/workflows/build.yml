name: Build patched image

# Every 6 hours (and on a push to this repo's patches/scripts/workflow): take
# kineticman/FastChannels' main branch (his releases) as it is right now, apply the patches
# in patches/, validate, build, smoke-test and boot-test the image, then publish that tested
# image to GHCR. Nothing is published unless every check passes, and the build-key dedup makes
# a run a no-op when upstream, the patches and the Player APK are all unchanged — so this
# builds + publishes promptly when his main moves, not just weekly. Run it by hand
# (Actions > Build patched image > Run workflow) for a build sooner.
#
# The DEVELOPMENT branch is watched separately (upstream-watch.yml): it dispatches this
# workflow in drift-check mode (drift_only=true, upstream_branch=development) to warn — and
# prepare a GLM 5.3 Flash fix — ahead of a release, without ever building or publishing.

on:
  schedule:
    # Every 6 hours: build + publish when kineticman's main (his releases) has a new commit;
    # otherwise the build-key dedup turns the run into a no-op. The development watcher
    # (upstream-watch.yml) warns ahead of a release; this is the real build + publish.
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if upstream, the patches and the Player APK are unchanged
        type: boolean
        default: false
      drift_only:
        description: Drift check only (apply, validate and refresh the patches; no image)
        type: boolean
        default: false
      upstream_repo:
        description: "Test only: build against this repo instead (nothing is published)"
        type: string
        default: ""
      upstream_branch:
        description: "Test only: build against this branch instead (nothing is published)"
        type: string
        default: ""

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write

env:
  UPSTREAM_REPO: ${{ inputs.upstream_repo || 'kineticman/FastChannels' }}
  UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
  # A test run (against another repo/branch) builds and checks but never publishes,
  # refreshes the patches, or files issues.
  TEST_RUN: ${{ (inputs.upstream_repo != '' || inputs.upstream_branch != '') && 'true' || 'false' }}
  # Drift-only = apply + validate the patches, NO image, NO publish. A push to this repo (a
  # CI/patch/doc change) runs a drift check — it reruns the tests but never rebuilds or
  # republishes the image. A dispatch can ask for it too (the development watcher does). Only a
  # SCHEDULED run does a full build, and the build-key dedup makes that a no-op unless upstream,
  # the Player APK or the patch actually changed — so :latest is rebuilt only on a real change.
  DRIFT_ONLY: ${{ (inputs.drift_only || github.event_name == 'push') && 'true' || 'false' }}
  # The Dockerfile always downloads the Player APK from kineticman's latest release.
  APK_REPO: kineticman/FastChannels
  IMAGE: ghcr.io/${{ github.repository_owner }}/fastchannels-mackid1993
  CONFLICT_TITLE: Patches no longer apply to upstream
  FAILED_TITLE: Build failed
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      conflict: ${{ steps.apply.outputs.conflict }}
      sha: ${{ steps.inputs.outputs.sha }}
      short: ${{ steps.inputs.outputs.short }}
      apk: ${{ steps.inputs.outputs.apk }}
      apk_tag: ${{ steps.inputs.outputs.apk_tag }}
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5
        with:
          path: overlay
          fetch-depth: 0

      - name: Resolve upstream commit, Player APK release and run mode
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git ls-remote "https://github.com/$UPSTREAM_REPO.git" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          [ -n "$sha" ] || { echo "::error::could not read upstream $UPSTREAM_BRANCH"; exit 1; }
          # The image bundles the Player APK from upstream's latest release, so a new
          # release must trigger a rebuild even when no code changed.
          apk=$(gh api "repos/$APK_REPO/releases/latest" \
                --jq '.tag_name + "@" + ([.assets[] | select(.name == "FastChannelsPlayer.apk") | "\(.id)-\(.updated_at)"] | first // "none")')
          # The build key is only what actually ends up IN the image: upstream, the Player
          # APK, and the patch's applied lines (added/removed only, so a context-only refresh
          # doesn't rebuild identical code). Scripts, workflows and docs are deliberately NOT
          # in the key, so changing CI never rebuilds or republishes the image — a new image
          # comes only from a new upstream commit, a new Player APK, or a real patch change.
          patchlines=$(cd overlay && grep -hE '^[-+]' patches/*.patch | sha256sum | cut -c1-12)
          key=$(printf '%s|%s|%s' "$sha" "$apk" "$patchlines" | sha256sum | cut -c1-12)
          # A drift day does a full build instead while the last build's failure is
          # unresolved, so a one-off failure is retried daily.
          drift=$DRIFT_ONLY
          if [ "$drift" = true ] && [ "$TEST_RUN" != true ] && overlay/scripts/issue.sh exists "$FAILED_TITLE"; then
            echo "The last build failed; doing a full build instead of a drift check."
            drift=false
          fi
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "apk=$apk"
            echo "apk_tag=${apk%%@*}"
            echo "key=$key"
            echo "drift=$drift"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream $UPSTREAM_BRANCH: $sha | Player APK: $apk | build key: $key | drift check only: $drift"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this exact build already exists
        id: skip
        run: |
          if [ "${{ inputs.force }}" != "true" ] && [ "${{ steps.inputs.outputs.drift }}" != "true" ] && docker buildx imagetools inspect "$IMAGE:build-${{ steps.inputs.outputs.key }}" >/dev/null 2>&1; then
            echo "Already built: upstream ${{ steps.inputs.outputs.short }}, APK ${{ steps.inputs.outputs.apk_tag }}, same patches."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out upstream
        if: steps.skip.outputs.skip != 'true'
        run: |
          # Full history, so git am --3way can find the original version of any
          # file a patch touches.
          git clone --branch "$UPSTREAM_BRANCH" "https://github.com/$UPSTREAM_REPO.git" upstream
          git -C upstream checkout -q "${{ steps.inputs.outputs.sha }}"

      - name: Apply patches
        id: apply
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: true
        run: overlay/scripts/apply-patches.sh upstream || { echo "conflict=true" >> "$GITHUB_OUTPUT"; exit 1; }

      - name: Report a patch conflict
        if: steps.skip.outputs.skip != 'true' && steps.apply.outcome == 'failure' && env.TEST_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > body.md <<BODY
          Upstream \`$UPSTREAM_BRANCH\` moved to [\`${{ steps.inputs.outputs.short }}\`](https://github.com/$UPSTREAM_REPO/commit/${{ steps.inputs.outputs.sha }}) and a patch in \`patches/\` conflicts with it, even with a 3-way merge. No image was published; \`:latest\` still points at the last good build.

          If the \`OPENROUTER_API_KEY\` secret is set, an AI is resolving the conflict now. Its fix must pass the static checks and a full image build, smoke test and boot test before it is merged; then a new image is published and this issue closes. If the AI can't fix it, you'll get a comment here.

          cc @${{ github.repository_owner }}

          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          To fix it by hand: clone upstream at that commit, run \`scripts/apply-patches.sh\`, resolve the conflict, finish with \`git am --continue\`, then run \`scripts/refresh-patches.sh <checkout> ${{ steps.inputs.outputs.sha }}\` and commit the updated patch here. The push rebuilds automatically.
          BODY
          overlay/scripts/issue.sh open "$CONFLICT_TITLE" body.md
          exit 1

      - name: Stop after a test-run conflict
        if: steps.apply.outcome == 'failure' && env.TEST_RUN == 'true'
        run: exit 1

      - name: Set up Python
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static checks
        if: steps.skip.outputs.skip != 'true'
        env:
          UPSTREAM_SHA: ${{ steps.inputs.outputs.sha }}
        run: |
          pip install --quiet ruff jinja2
          overlay/scripts/validate.sh upstream

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true' && steps.inputs.outputs.drift != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.skip.outputs.skip != 'true' && steps.inputs.outputs.drift != 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64
          load: true
          tags: fastchannels:ci
          labels: |
            org.opencontainers.image.title=FastChannels (mackid1993)
            org.opencontainers.image.description=kineticman/FastChannels main (releases) plus the DirecTV DAI patch
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.inputs.outputs.sha }}
            fastchannels.player-apk=${{ steps.inputs.outputs.apk_tag }}
          # Unique per run, so every build re-downloads yt-dlp and the newest
          # Player APK from upstream's latest release.
          build-args: |
            YTDLP_REFRESH=${{ github.run_id }}
            FC_PLAYER_APK_REFRESH=${{ steps.inputs.outputs.apk }}-${{ github.run_id }}
          # No GitHub Actions layer cache: the yt-dlp/Player-APK layers (and everything
          # after) are busted every run by the run_id build-args above, so cache-from
          # restored little while cache-to,mode=max spent ~3 min exporting every build.
          # Removed 2026-10-02 to measure the cacheless time; re-add if a run proves slower.

      - name: Check the Player APK is bundled
        if: steps.skip.outputs.skip != 'true' && steps.inputs.outputs.drift != 'true'
        run: |
          docker run --rm --entrypoint sh fastchannels:ci -c 'test -s /app/fc_player_release.apk' \
            || { echo "::error::the image has no FastChannels Player APK (upstream release ${{ steps.inputs.outputs.apk_tag }})"; exit 1; }
          echo "Bundled the Player APK from ${{ steps.inputs.outputs.apk_tag }}."

      - name: Smoke-test the patched code in the image
        if: steps.skip.outputs.skip != 'true' && steps.inputs.outputs.drift != 'true'
        run: docker run --rm -w /app -v "$PWD/overlay/scripts:/ci:ro" --entrypoint python fastchannels:ci /ci/smoke_test.py

      - name: Boot test
        if: steps.skip.outputs.skip != 'true' && steps.inputs.outputs.drift != 'true'
        run: overlay/scripts/boot_test.sh fastchannels:ci

      - name: Publish the tested image to GHCR
        if: steps.skip.outputs.skip != 'true' && env.TEST_RUN != 'true' && steps.inputs.outputs.drift != 'true'
        run: |
          # Push the exact image that passed the tests, not a rebuild. The build-<key>
          # tag goes last: its presence is what marks this build as done.
          for tag in latest "upstream-${{ steps.inputs.outputs.short }}" "build-${{ steps.inputs.outputs.key }}"; do
            docker tag fastchannels:ci "$IMAGE:$tag"
            docker push -q "$IMAGE:$tag"
          done
          echo "Published upstream ${{ steps.inputs.outputs.short }} with the patches as $IMAGE:latest."

      - name: Refresh patches against this upstream
        if: steps.skip.outputs.skip != 'true' && env.TEST_RUN != 'true'
        run: |
          overlay/scripts/refresh-patches.sh upstream "${{ steps.inputs.outputs.sha }}"
          cd overlay
          # refresh-patches.sh rewrites both patches/ and source/ (the readable copies of the
          # overlay's own modules), so commit both — otherwise an AI fix that adapted a module
          # would leave source/ silently drifted from the patch.
          [ -n "$(git status --porcelain patches source)" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A patches source
          git commit -q -m "Refresh patches against upstream ${{ steps.inputs.outputs.short }}"
          if ! git push -q; then
            # main moved during this run. Rebase onto it only if nobody changed
            # patches/ or source/ in the meantime; otherwise their version wins and this
            # refresh is simply redone on the next run.
            git fetch -q origin main
            if git diff --quiet HEAD~1 origin/main -- patches source; then
              git rebase -q origin/main && git push -q
            else
              echo "::notice::patches/ or source/ changed on main during this run; skipping this refresh."
              exit 0
            fi
          fi
          echo "Patch context updated for upstream ${{ steps.inputs.outputs.short }}."

      - name: Close resolved issues
        if: steps.skip.outputs.skip != 'true' && env.TEST_RUN != 'true' && steps.inputs.outputs.drift != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg="Fixed: built, tested and published upstream ${{ steps.inputs.outputs.short }} with the patches."
          overlay/scripts/issue.sh close "$CONFLICT_TITLE" "$msg"
          overlay/scripts/issue.sh close "$FAILED_TITLE" "$msg"

      - name: Ping that a new image was built and published
        continue-on-error: true  # a notification hiccup must never fail a successful publish
        # Fires only on a real publish (a new upstream commit, a new Player APK, or an AI
        # patch fix that landed — never on a CI-only change, which is drift-only and doesn't
        # reach here). Opens a transient issue that @mentions you, so GitHub emails you, then
        # closes it immediately — a success ping with no lingering issue.
        if: steps.skip.outputs.skip != 'true' && env.TEST_RUN != 'true' && steps.inputs.outputs.drift != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > ping.md <<BODY
          Built and published \`$IMAGE:latest\` for upstream [\`${{ steps.inputs.outputs.short }}\`](https://github.com/$UPSTREAM_REPO/commit/${{ steps.inputs.outputs.sha }}) (Player APK \`${{ steps.inputs.outputs.apk_tag }}\`). Every check passed: image build, Player APK, smoke test and boot test. If this followed an AI patch fix, the "$CONFLICT_TITLE"/"$FAILED_TITLE" status issue has the details.

          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          cc @${{ github.repository_owner }}
          BODY
          # Open only, and do NOT close: the @mention auto-subscribes you to the thread, so a
          # close (or comment) would be a second/third notification email. Leaving it open means
          # exactly one email (the @mention). These FYI issues can be bulk-closed any time with:
          #   gh issue list -R <repo> --search 'Built & published in:title' --json number \
          #     --jq '.[].number' | xargs -I{} gh issue close -R <repo> {}
          url=$(gh issue create -R "$GITHUB_REPOSITORY" --title "Built & published upstream ${{ steps.inputs.outputs.short }}" --body-file ping.md)
          echo "Opened success ping (left open so you get exactly one email): $url"

      - name: Report a failed build
        if: failure() && steps.apply.outcome != 'failure' && env.TEST_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > body.md <<BODY
          Upstream \`${{ steps.inputs.outputs.short }}\` with the patches failed a check (the patch applied cleanly — this isn't a merge conflict). No image was published; \`:latest\` still points at the last good build.

          On the unattended scheduled runs an AI tries to fix this automatically: it reproduces the failing check, adapts the patch to upstream's current code (editing only the patch's own files), and must pass a full image build, Player APK check, smoke test and boot test before anything is merged and published. If it can't, you'll get a comment here. (A failure from a manual run isn't auto-fixed — re-run on schedule or fix by hand.) Until this is resolved the daily drift check does a full build instead, so a one-off failure is retried daily.

          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          cc @${{ github.repository_owner }}
          BODY
          overlay/scripts/issue.sh open "$FAILED_TITLE" body.md

      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows in repos with no activity for 60 days.
        # Runs even when the job failed, so a long-running failure can't silence it.
        if: ${{ !cancelled() && env.TEST_RUN != 'true' }}
        run: |
          cd overlay
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q --allow-empty -m "Keep the scheduled build active"
            git push -q || echo "main moved during this run, which already counts as activity."
          fi

  # Before the AI resolves a conflict, consult the cache of prepared fixes: a held PR whose
  # patches already apply + validate against this upstream is reused as-is — merge it and kick
  # the publish build (which re-runs the full gauntlet and dedups by build key, so it can't
  # over-build), skipping the AI. Gates the resolve job. Real runs only: a test run builds the
  # cache (opens held PRs), it doesn't spend it, and must never merge/publish.
  try-cache:
    needs: build
    if: >-
      always() && (inputs.upstream_repo || '') == '' && (inputs.upstream_branch || '') == '' &&
      needs.build.outputs.conflict == 'true' && needs.build.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
    outputs:
      hit: ${{ steps.cache.outputs.hit }}
    steps:
      - name: Check out this repo
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v5
        with:
          path: overlay
      - name: Set up Python
        if: env.HAS_KEY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse a held fix from the cache before paying the AI
        id: cache
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openrouter/z-ai/glm-5.3-flash' }}
        run: |
          pip install --quiet ruff jinja2
          # `|| true`: the script exits 1 on a cache miss and the default shell is -eo pipefail,
          # so without it the step would abort on a miss instead of taking the else branch.
          num=$(overlay/scripts/try_held_fixes.sh overlay "$UPSTREAM_REPO" "${{ needs.build.outputs.sha }}" | tail -1) || true
          if [ -n "$num" ] && overlay/scripts/adopt_held_fix.sh overlay "$num" && gh workflow run build.yml --repo "$GITHUB_REPOSITORY"; then
            echo "Cache hit: reused held fix PR #$num (no AI) — adopted onto main and kicked the publish build."
            echo "hit=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$num" ]; then
            echo "::warning::found held fix PR #$num but adopt/publish failed — falling through to the AI."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs only when the patch conflicts. Aider (with an OpenRouter model) runs with a
  # read-only token and no git credentials, and can edit only the conflicted files in
  # a throwaway checkout. Its result must pass the static checks AND a full image
  # build, APK check, smoke test and boot test before open-pr merges it. A bad fix
  # never reaches main, so the conflict stays reproducible and is retried next run.
  resolve:
    needs: [build, try-cache]
    if: always() && needs.build.outputs.conflict == 'true' && needs.try-cache.outputs.hit != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
    steps:
      - name: Check out this repo
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v5
        with:
          path: overlay
          persist-credentials: false

      - name: Recreate the conflict
        if: env.HAS_KEY == 'true'
        run: |
          git clone --branch "$UPSTREAM_BRANCH" "https://github.com/$UPSTREAM_REPO.git" upstream
          cd upstream
          git checkout -q "${{ needs.build.outputs.sha }}"
          git config user.name "fastchannels-ci"
          git config user.email "fastchannels-ci@users.noreply.github.com"
          # Stops at the conflicting patch, leaving conflict markers in the files.
          git am --3way --keep-cr ../overlay/patches/*.patch || true
          [ -d .git/rebase-apply ] || { echo "::error::expected git am to stop at a conflict"; exit 1; }
          git diff --name-only --diff-filter=U > ../conflicted.txt
          echo "Conflicted files:"; cat ../conflicted.txt
          cp .git/rebase-apply/patch ../conflict.patch
          # Swap each conflict block for upstream's side and write both sides to a
          # brief. The AI then edits plain, valid code: Aider's edit format uses the
          # same "=======" line as git's markers and gets confused by them.
          python3 ../overlay/scripts/extract_conflicts.py ../conflicts.md $(cat ../conflicted.txt)
          # Snapshot every file, to prove afterwards the AI changed only the conflicted ones.
          find . -path ./.git -prune -o -type f -print0 | xargs -0 sha1sum | sort -k2 > ../before.sha1

      - name: Set up Python
        if: env.HAS_KEY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ask the AI to resolve the conflict
        if: env.HAS_KEY == 'true'
        timeout-minutes: 20
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Any OpenRouter model, as "openrouter/<model id>". Override with the
          # AI_MODEL repo variable (set to openrouter/z-ai/glm-5.3-flash).
          AI_MODEL: ${{ vars.AI_MODEL || 'openrouter/z-ai/glm-5.3-flash' }}
        run: |
          # Pinned: a new Aider release can change or drop flags this step relies on.
          pip install --quiet aider-chat==0.86.2
          cd upstream
          cat > ../prompt.txt <<'PROMPT'
          You are running FULLY AUTONOMOUSLY in CI. Nobody will read your reply or answer
          anything -- never ask a question or wait for confirmation; decide and act. You are
          given upstream_index.txt, a map of upstream's CURRENT files and every def/class in
          them; use it to find where upstream moved the code a hook needs (this can be a large
          adaptation -- effectively backporting the patch onto a different upstream).

          The files you can edit are the FastChannels DirecTV overlay: a PATCH on upstream
          kineticman/FastChannels. The patch is our own modules (directv_dai.py, dtv_android.py,
          dtv_aac_ads.py, dtv_aac_gain.py) plus one-line HOOKS injected into upstream files. A
          hook is one line that wires our code into an upstream file (an import, a
          `dai=directv_dai.request_flags(...)` argument, a `dtv_android.sign_in(...)` call, a
          `dai: dict | None = None` parameter we add); every other line in those files, function
          names included, is UPSTREAM's. The patch adds an opt-in "DirecTV ad insertion (DAI)"
          feature and no longer applied cleanly. Every part that applied cleanly is already in
          these files; where it conflicted the files hold upstream's code, and conflicts.md shows
          each spot: upstream's code, and what the patch wanted (written against an older
          upstream). The full patch is in conflict.patch; AGENTS.md explains the hooks; and
          smoke_test.py and validate.sh are the overlay's own tests -- the spec your result must
          later pass, given to you to read (you cannot edit them).

          For each conflict in conflicts.md, write code that keeps upstream's current behavior
          AND re-wires the patch's hook. Rules:
          - Edit only the conflicted files you were given; the tests and every other file are
            read-only.
          - Keep every upstream change. A HOOK FOLLOWS UPSTREAM: if upstream renamed or moved a
            name a hook calls or sits in, update that reference (found via upstream_index.txt) to
            upstream's current name/location -- anywhere in the files you're editing, not only
            inside a conflict block.
          - If a test references an upstream name by its OLD name and upstream renamed or MOVED it,
            point that name at the REAL relocated code: a module-level alias next to a renamed
            function in a file you edit (`old = new`), or -- for a moved module the patch does not
            own -- a `sys.modules['app.<oldname>'] = <real new module>` registered from one of our
            own modules. No wrapper, no new logic.
          - BACKPORT, DON'T FABRICATE: a capability may be gone as a named function/module yet
            still be rebuildable from real upstream data that's still present (a registry is gone
            but the thing(s) it listed remain -- a settings field, a single-item accessor). Then
            re-implement it in one of OUR modules reading that REAL source and expose it under
            the pinned name (a module alias, or a sys.modules runtime module carrying your real
            function). That is a real port, NOT fabrication, and it's the correct fix -- the code
            must read real data so the feature works. Forbidden only: inventing/hardcoding data,
            or a hollow stub. Make no edit (say what's gone in one sentence) only when no real
            source exists to rebuild from.
          - Don't refactor, reformat or touch anything the conflict doesn't require. Keep the
            Python valid.
          PROMPT
          # Map of upstream's CURRENT tree so the AI can find where moved code went.
          { echo "# upstream files:"; find app -type f \( -name '*.py' -o -name '*.html' \) | sort
            echo; echo "# definitions (path:line: def/class):"
            find app -name '*.py' -type f -print0 | sort -z \
              | xargs -0 grep -nHE '^[[:space:]]*(async def|def|class) ' 2>/dev/null
          } > ../upstream_index.txt
          # Aider can edit only the files named on the command line; the brief, the
          # patch and AGENTS.md are read-only context. CI does all git operations and
          # validation, so Aider's own git, lint, test, shell and URL features are off.
          aider --model "$AI_MODEL" --edit-format diff --yes-always --no-git \
                --no-auto-commits --no-auto-lint --no-auto-test --no-suggest-shell-commands \
                --no-detect-urls --no-show-model-warnings --no-check-update --no-analytics \
                --no-pretty --map-tokens 0 --read ../conflicts.md --read ../conflict.patch \
                --read ../upstream_index.txt --read ../overlay/AGENTS.md \
                --read ../overlay/scripts/smoke_test.py --read ../overlay/scripts/validate.sh \
                --message-file ../prompt.txt \
                $(cat ../conflicted.txt)

      - name: Check the result and finish the merge
        if: env.HAS_KEY == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cd upstream
          conflicted=$(cat ../conflicted.txt)
          find . -path ./.git -prune -o -type f -print0 | xargs -0 sha1sum | sort -k2 > ../after.sha1
          changed=$(diff ../before.sha1 ../after.sha1 | awk '/^[<>]/{print $3}' | sed 's|^\./||' | sort -u | grep -vE '^\.aider' || true)
          echo "Files the AI changed:"; echo "${changed:-(none)}"
          [ -n "$changed" ] || { echo "::error::the AI made no changes"; exit 1; }
          stray=$(printf '%s\n' $changed | grep -vxF -f ../conflicted.txt || true)
          [ -z "$stray" ] || { echo "::error::the AI changed files outside the conflict: $stray"; exit 1; }
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' $conflicted; then
            echo "::error::conflict markers in the result"; exit 1
          fi
          # Belt and braces: the key is never in the model's context, but make sure
          # it can't end up in files that become a public PR.
          if grep -qF -- "$OPENROUTER_API_KEY" $conflicted; then
            echo "::error::the API key appeared in an edited file"; exit 1
          fi
          rm -rf .aider*
          git add -- $conflicted
          GIT_EDITOR=true git am --continue

      - name: Repair any drift the merge left, then verify the full gauntlet
        if: env.HAS_KEY == 'true'
        timeout-minutes: 60
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openrouter/z-ai/glm-5.3-flash' }}
          UPSTREAM_SHA: ${{ needs.build.outputs.sha }}
          APK: ${{ needs.build.outputs.apk }}
          CACHE_BUST: ${{ github.run_id }}
        run: |
          # The conflict is already resolved and committed (git am --continue above). The shared
          # fixer runs the whole gauntlet: if resolving the markers was enough it exits 2 (nothing
          # more to do); if the same upstream change also drifted a non-conflicted patch file (e.g.
          # an added module importing a renamed name) it exits 0 after the AI fixes that too; it
          # exits 1 if it can't. Either 0 or 2 means the resolved patch now passes everything.
          # reproduce.sh uses the runner's default Docker builder (loads into the daemon), so no
          # buildx/container driver here — that would build without loading and break docker run.
          set +e
          overlay/scripts/ai_fix_drift.sh upstream overlay
          code=$?
          set -e
          [ "$code" = 0 ] || [ "$code" = 2 ] \
            || { echo "::error::the resolved patch did not pass the full gauntlet"; exit 1; }

      - name: Export the ported patch
        if: env.HAS_KEY == 'true'
        run: overlay/scripts/refresh-patches.sh upstream "${{ needs.build.outputs.sha }}"

      - name: Upload the ported patch
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ported-patches
          # Both patches/ and source/ — refresh-patches.sh rewrites both, and open-pr
          # commits both so source/ never drifts from the patch after an AI fix.
          path: |
            overlay/patches
            overlay/source

  # Runs only when the patch APPLIED cleanly but a later check failed — upstream drift broke
  # a hook or an added module's dependency, not a merge conflict — and only on the unattended
  # scheduled runs (or a test-run dispatch). Never on a push (that would "fix" our own
  # deliberate changes) and never on the post-merge dispatch (which has no test inputs). It
  # reproduces the failing check: a clean reproduction (a transient hiccup, or a failure that
  # was only in the publish/refresh steps) sets failed=false and nothing else runs; a Docker
  # or APK failure is infrastructure, not patch-fixable, so it also bails. A real drift in
  # compile/validate/smoke/boot goes to the AI, whose fix is bounded to the patch-touched
  # files and must pass the full gauntlet before open-pr merges it — same bar as the conflict
  # path. A bad fix never reaches main, so the failure stays reproducible and is retried.
  resolve-drift:
    needs: build
    if: >-
      always() && needs.build.result == 'failure' &&
      needs.build.outputs.conflict != 'true' && needs.build.outputs.sha != '' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        ((inputs.upstream_repo || '') != '' || (inputs.upstream_branch || '') != '')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      fixed: ${{ steps.repair.outputs.fixed }}
      cache_hit: ${{ steps.cache.outputs.hit }}
    env:
      HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
    steps:
      - name: Check out this repo
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v5
        with:
          path: overlay
          persist-credentials: false

      - name: Check out upstream and apply the patches
        if: env.HAS_KEY == 'true'
        run: |
          git clone --branch "$UPSTREAM_BRANCH" "https://github.com/$UPSTREAM_REPO.git" upstream
          cd upstream
          git checkout -q "${{ needs.build.outputs.sha }}"
          git config user.name "fastchannels-ci"
          git config user.email "fastchannels-ci@users.noreply.github.com"
          # These applied cleanly in the build job (this job only runs with conflict=false),
          # so a conflict here is unexpected — fail loudly rather than hand the AI a mess.
          ../overlay/scripts/apply-patches.sh . \
            || { echo "::error::patches did not apply cleanly in the drift job"; exit 1; }

      - name: Set up Python
        if: env.HAS_KEY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Log in to GHCR
        if: env.HAS_KEY == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse a held fix from the cache before paying the AI
        id: cache
        if: env.HAS_KEY == 'true' && env.TEST_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openrouter/z-ai/glm-5.3-flash' }}
        run: |
          # Consult the cache of prepared fixes (open held PRs) before running the AI. If a held
          # PR's patches still apply + validate against this upstream, reuse it as-is: merge it
          # and kick the publish build — which re-runs the full gauntlet and dedups by build key,
          # so it can't over-build. Real runs only; a test run builds the cache, it doesn't spend
          # it (and must never merge/publish).
          pip install --quiet ruff jinja2
          # `|| true`: the script exits 1 on a cache miss under the default -eo pipefail shell;
          # without it the step aborts on a miss and the AI drift-repair below would be skipped.
          num=$(overlay/scripts/try_held_fixes.sh overlay "$UPSTREAM_REPO" "${{ needs.build.outputs.sha }}" | tail -1) || true
          if [ -n "$num" ] && overlay/scripts/adopt_held_fix.sh overlay "$num" && gh workflow run build.yml --repo "$GITHUB_REPOSITORY"; then
            echo "Cache hit: reused held fix PR #$num (no AI) — adopted onto main and kicked the publish build."
            echo "hit=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$num" ]; then
            echo "::warning::found held fix PR #$num but adopt/publish failed — falling through to the AI."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reproduce the failure; the AI repairs only on a real drift
        id: repair
        if: env.HAS_KEY == 'true' && steps.cache.outputs.hit != 'true'
        timeout-minutes: 60
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openrouter/z-ai/glm-5.3-flash' }}
          UPSTREAM_SHA: ${{ needs.build.outputs.sha }}
          APK: ${{ needs.build.outputs.apk }}
          CACHE_BUST: ${{ github.run_id }}
        run: |
          # The patch applied cleanly but a check failed. The shared fixer reproduces the whole
          # gauntlet, hands the AI the failing log + the patch-touched files, verifies and
          # re-checks. 0 = a drift was reproduced and fixed (export it); 2 = nothing reproduced,
          # so the build-job failure was transient or publish/refresh-only (export nothing); 1 =
          # an infrastructure failure or the AI couldn't fix it. reproduce.sh uses the runner's
          # default Docker builder (loads into the daemon), so no buildx/container driver here.
          set +e
          overlay/scripts/ai_fix_drift.sh upstream overlay
          code=$?
          set -e
          case "$code" in
            0) echo "A drift was reproduced and fixed."; echo "fixed=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "Nothing reproduced — the build-job failure was transient; leaving it to the next run."; echo "fixed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the AI could not fix the drift"; exit 1 ;;
          esac

      - name: Export the ported patch
        if: env.HAS_KEY == 'true' && steps.repair.outputs.fixed == 'true'
        run: overlay/scripts/refresh-patches.sh upstream "${{ needs.build.outputs.sha }}"

      - name: Upload the ported patch
        if: env.HAS_KEY == 'true' && steps.repair.outputs.fixed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ported-patches
          path: |
            overlay/patches
            overlay/source

  # Opens and auto-merges the AI's fix, from either path: a resolved conflict (resolve) or a
  # resolved drift (resolve-drift). Both upload the same `ported-patches` artifact, and only
  # one of the two can run per workflow (conflict is XOR drift), so the download is the same;
  # the kind only changes the branch name, title and wording.
  open-pr:
    needs: [build, resolve, resolve-drift]
    if: >-
      always() && (inputs.upstream_repo || '') == '' &&
      ((needs.build.outputs.conflict == 'true' && needs.resolve.result == 'success') ||
       (needs.build.result == 'failure' && needs.build.outputs.conflict != 'true' &&
        needs.resolve-drift.outputs.fixed == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5
        with:
          # Always base the PR on main, never on a feature branch a test run was dispatched
          # from — otherwise the PR would carry that branch's workflow changes and a
          # GITHUB_TOKEN push touching .github/workflows/ can be refused.
          ref: main

      - name: Download the ported patch
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ported-patches
          path: ported

      - name: Open and merge a pull request
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.build.outputs.short }}
          SHA: ${{ needs.build.outputs.sha }}
          CONFLICT: ${{ needs.build.outputs.conflict }}
        run: |
          if [ "$CONFLICT" = "true" ]; then
            branch="auto/port-$SHORT"; issue_title="$CONFLICT_TITLE"
            title="Port patches to upstream $SHORT"
            reason="the patch conflicted"
            did="resolved the conflict, changing only the conflicted files"
          else
            branch="auto/drift-$SHORT"; issue_title="$FAILED_TITLE"
            title="Fix patch drift against upstream $SHORT"
            reason="the patch applied cleanly but a check then failed (upstream drift)"
            did="adapted the patch to upstream's current code, changing only the patch's own files"
          fi
          rm -f patches/*.patch
          cp ported/patches/*.patch patches/
          # Keep source/ in step with the patch (the AI may have adapted an overlay module).
          # Copy over, don't wipe — source/README.md isn't in the artifact.
          [ -d ported/source ] && cp -R ported/source/. source/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A patches source
          git commit -q -m "$title (resolved by AI)"
          git push -f origin "$branch"
          issue=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$issue_title\") | .number" | head -1)
          if [ "$TEST_RUN" = true ]; then
            title="Held fix: $title — auto-merges once valid against main"
            merge_note="**Held — no action needed (FYI).** This is the agent's prepared fix for upstream *development*. The reconcile workflow auto-merges it the moment it is proven valid against \`main\`, then publishes — and a wrong fix can't reach \`:latest\` because that build re-runs every check. Nothing for you to do; this is just so you're aware."
          else
            merge_note="This PR is merged automatically, which starts the publishing build. \`:latest\` only updates if that build passes too."
          fi
          cat > body.md <<BODY
          Upstream moved to [\`$SHORT\`](https://github.com/$UPSTREAM_REPO/commit/$SHA) and $reason. The AI (\`${{ vars.AI_MODEL || 'openrouter/z-ai/glm-5.3-flash' }}\` via Aider) $did. The result passed the static checks and a full image build, Player APK check, smoke test and boot test.

          $merge_note

          ${issue:+Refs #$issue}

          cc @${{ github.repository_owner }}
          BODY
          pr=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
          [ -n "$pr" ] || pr=$(gh pr create --head "$branch" --base main --title "$title" --body-file body.md)
          echo "Opened $pr"
          if [ "$TEST_RUN" = true ]; then
            echo "Test run: leaving the PR open and publishing nothing."
            exit 0
          fi
          # workflow_dispatch is used because pushes made with GITHUB_TOKEN don't
          # trigger workflows.
          gh pr merge "$pr" --squash --delete-branch
          gh workflow run build.yml --ref main
          echo "Merged $pr and started the publishing build."

  # If the AI couldn't produce a fix that passes every check, say so on the matching status
  # issue (which pings you) instead of leaving it saying a fix is being attempted. Covers both
  # the conflict path (resolve/open-pr) and the drift path (resolve-drift/open-pr). A clean
  # reproduction in resolve-drift is a success with fixed!=true, so it never reaches here —
  # only a genuine inability to fix does. Never on test runs.
  ai-failed:
    needs: [build, resolve, resolve-drift, open-pr]
    if: >-
      always() && needs.build.outputs.sha != '' &&
      (inputs.upstream_repo || '') == '' && (inputs.upstream_branch || '') == '' &&
      ((needs.build.outputs.conflict == 'true' &&
        (needs.resolve.result == 'failure' || needs.open-pr.result == 'failure')) ||
       (needs.build.result == 'failure' && needs.build.outputs.conflict != 'true' &&
        (needs.resolve-drift.result == 'failure' || needs.open-pr.result == 'failure')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5

      - name: Comment on the status issue
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT: ${{ needs.build.outputs.conflict }}
        run: |
          if [ "$CONFLICT" = "true" ]; then
            title="$CONFLICT_TITLE"; what="the conflict"
          else
            title="$FAILED_TITLE"; what="this drift"
          fi
          cat > body.md <<BODY
          The AI could not produce a fix for $what against upstream \`${{ needs.build.outputs.short }}\` that passes every check, so nothing was merged or published. It will try again on the next daily run; if upstream doesn't change, it will likely fail the same way, so this needs a manual fix (steps above).

          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          cc @${{ github.repository_owner }}
          BODY
          scripts/issue.sh open "$title" body.md
