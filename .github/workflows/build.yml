name: Build patched image

# Once a week: take kineticman/FastChannels' development branch as it is right
# now, apply the patches in patches/, validate, build, smoke-test and boot-test the
# image, then publish it to GHCR. Nothing is published unless every check passes.
# Run it by hand (Actions > Build patched image > Run workflow) for a build sooner.

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 9:00 AM Eastern
      timezone: "America/New_York"
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if upstream, the patches and the Player APK are unchanged
        type: boolean
        default: false
      upstream_repo:
        description: "Test only: build against this repo instead (nothing is published)"
        type: string
        default: ""
      upstream_branch:
        description: "Test only: build against this branch instead (nothing is published)"
        type: string
        default: ""

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write

env:
  UPSTREAM_REPO: ${{ inputs.upstream_repo || 'kineticman/FastChannels' }}
  UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'development' }}
  # A test run (against another repo/branch) builds and checks but never publishes,
  # refreshes the patches, or files issues.
  TEST_RUN: ${{ (inputs.upstream_repo != '' || inputs.upstream_branch != '') && 'true' || 'false' }}
  # The Dockerfile always downloads the Player APK from kineticman's latest release.
  APK_REPO: kineticman/FastChannels
  IMAGE: ghcr.io/${{ github.repository_owner }}/fastchannels-mackid1993
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      conflict: ${{ steps.apply.outputs.conflict }}
      sha: ${{ steps.inputs.outputs.sha }}
      short: ${{ steps.inputs.outputs.short }}
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5
        with:
          path: overlay
          fetch-depth: 0

      - name: Resolve upstream commit and Player APK release
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git ls-remote "https://github.com/$UPSTREAM_REPO.git" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          [ -n "$sha" ] || { echo "::error::could not read upstream $UPSTREAM_BRANCH"; exit 1; }
          # The image bundles the Player APK from upstream's latest release, so a new
          # release must trigger a rebuild even when no code changed.
          apk=$(gh api "repos/$APK_REPO/releases/latest" \
                --jq '.tag_name + "@" + ([.assets[] | select(.name == "FastChannelsPlayer.apk") | "\(.id)-\(.updated_at)"] | first // "none")')
          # Only the patches' added/removed lines count, so the automatic context
          # refresh below doesn't trigger a pointless rebuild of identical code.
          overlay=$(cd overlay && { git ls-files -s scripts .github/workflows/build.yml; grep -hE '^[-+]' patches/*.patch; } | sha256sum | cut -c1-12)
          key=$(printf '%s|%s|%s' "$sha" "$apk" "$overlay" | sha256sum | cut -c1-12)
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
            echo "apk=$apk"
            echo "apk_tag=${apk%%@*}"
            echo "key=$key"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream $UPSTREAM_BRANCH: $sha | Player APK: $apk | build key: $key"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this exact build already exists
        id: skip
        run: |
          if [ "${{ inputs.force }}" != "true" ] && docker manifest inspect "$IMAGE:build-${{ steps.inputs.outputs.key }}" >/dev/null 2>&1; then
            echo "Already built: upstream ${{ steps.inputs.outputs.short }}, APK ${{ steps.inputs.outputs.apk_tag }}, same patches."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out upstream
        if: steps.skip.outputs.skip != 'true'
        run: |
          # Full history, so git am --3way can find the original version of any
          # file a patch touches.
          git clone --branch "$UPSTREAM_BRANCH" "https://github.com/$UPSTREAM_REPO.git" upstream
          git -C upstream checkout -q "${{ steps.inputs.outputs.sha }}"

      - name: Apply patches
        id: apply
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: true
        run: overlay/scripts/apply-patches.sh upstream || { echo "conflict=true" >> "$GITHUB_OUTPUT"; exit 1; }

      - name: Report a patch conflict
        if: steps.skip.outputs.skip != 'true' && steps.apply.outcome == 'failure' && env.TEST_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Patches no longer apply to upstream"
          body=$(cat <<BODY
          Upstream \`$UPSTREAM_BRANCH\` moved to [\`${{ steps.inputs.outputs.short }}\`](https://github.com/$UPSTREAM_REPO/commit/${{ steps.inputs.outputs.sha }}) and a patch in \`patches/\` conflicts with it, even with a 3-way merge. No image was published; \`:latest\` still points at the last good build.

          If the \`GEMINI_API_KEY\` secret is set, Gemini is resolving the conflict now. If its fix passes the checks, it is merged automatically and a new image is built and tested; this issue closes when that build succeeds.

          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          To fix: clone upstream at that commit, run \`scripts/apply-patches.sh\`, resolve the conflict, finish with \`git am --continue\`, then run \`scripts/refresh-patches.sh <checkout> ${{ steps.inputs.outputs.sha }}\` and commit the updated patch here. The push rebuilds automatically.
          BODY
          )
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
          exit 1

      - name: Stop after a test-run conflict
        if: steps.apply.outcome == 'failure' && env.TEST_RUN == 'true'
        run: exit 1

      - name: Set up Python
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static checks
        if: steps.skip.outputs.skip != 'true'
        env:
          UPSTREAM_SHA: ${{ steps.inputs.outputs.sha }}
        run: |
          pip install --quiet ruff jinja2
          overlay/scripts/validate.sh upstream

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64
          load: true
          tags: fastchannels:ci
          # Unique per run, so every build re-downloads yt-dlp and the newest
          # Player APK from upstream's latest release.
          build-args: |
            YTDLP_REFRESH=${{ github.run_id }}
            FC_PLAYER_APK_REFRESH=${{ steps.inputs.outputs.apk }}-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the Player APK is bundled
        if: steps.skip.outputs.skip != 'true'
        run: |
          docker run --rm --entrypoint sh fastchannels:ci -c 'test -s /app/fc_player_release.apk' \
            || { echo "::error::the image has no FastChannels Player APK (upstream release ${{ steps.inputs.outputs.apk_tag }})"; exit 1; }
          echo "Bundled the Player APK from ${{ steps.inputs.outputs.apk_tag }}."

      - name: Smoke test the DAI code in the image
        if: steps.skip.outputs.skip != 'true'
        run: docker run --rm -w /app -v "$PWD/overlay/scripts:/ci:ro" --entrypoint python fastchannels:ci /ci/smoke_test.py

      - name: Boot test
        if: steps.skip.outputs.skip != 'true'
        run: overlay/scripts/boot_test.sh fastchannels:ci

      - name: Publish to GHCR
        if: steps.skip.outputs.skip != 'true' && env.TEST_RUN != 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:upstream-${{ steps.inputs.outputs.short }}
            ${{ env.IMAGE }}:build-${{ steps.inputs.outputs.key }}
          labels: |
            org.opencontainers.image.title=FastChannels (mackid1993)
            org.opencontainers.image.description=kineticman/FastChannels development plus the DirecTV DAI patch
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.inputs.outputs.sha }}
            fastchannels.player-apk=${{ steps.inputs.outputs.apk_tag }}
          build-args: |
            YTDLP_REFRESH=${{ github.run_id }}
            FC_PLAYER_APK_REFRESH=${{ steps.inputs.outputs.apk }}-${{ github.run_id }}
          cache-from: type=gha

      - name: Refresh patches against this upstream
        if: steps.skip.outputs.skip != 'true' && env.TEST_RUN != 'true'
        run: |
          overlay/scripts/refresh-patches.sh upstream "${{ steps.inputs.outputs.sha }}"
          cd overlay
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain patches)" ]; then
            git add -A patches
            git commit -q -m "Refresh patches against upstream ${{ steps.inputs.outputs.short }}"
            git push
            echo "Patch context updated for upstream ${{ steps.inputs.outputs.short }}."
          fi

      - name: Close the conflict issue
        if: steps.skip.outputs.skip != 'true' && env.TEST_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Patches no longer apply to upstream" OR in:title "Build failed"' --json number --jq '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Fixed: built and published upstream ${{ steps.inputs.outputs.short }} with the patches."
          done

      - name: Report a failed build
        if: failure() && steps.apply.outcome != 'failure' && env.TEST_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Build failed"
          body="Upstream \`${{ steps.inputs.outputs.short }}\` with the patches failed a check. No image was published; \`:latest\` still points at the last good build. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi

      - name: Keep the schedule alive
        # GitHub pauses scheduled workflows in repos with no activity for 60 days.
        if: env.TEST_RUN != 'true'
        run: |
          cd overlay
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q --allow-empty -m "Keep the scheduled build active"
            git push
          fi

  # Runs only when the patch conflicts. Gemini gets a read-only token, no git
  # credentials and no other secrets, and works in a throwaway checkout. Its result
  # must touch only the conflicted files and pass the static checks, then comes to
  # you as a pull request. Merging it triggers the normal build (image, APK check,
  # smoke test, boot test) before anything is published.
  resolve:
    needs: build
    if: always() && needs.build.outputs.conflict == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - name: Check out this repo
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v5
        with:
          path: overlay
          persist-credentials: false

      - name: Recreate the conflict
        if: env.HAS_KEY == 'true'
        run: |
          git clone --branch "$UPSTREAM_BRANCH" "https://github.com/$UPSTREAM_REPO.git" upstream
          cd upstream
          git checkout -q "${{ needs.build.outputs.sha }}"
          git config user.name "fastchannels-ci"
          git config user.email "fastchannels-ci@users.noreply.github.com"
          # Stops at the conflicting patch, leaving conflict markers in the files.
          git am --3way --keep-cr ../overlay/patches/*.patch || true
          [ -d .git/rebase-apply ] || { echo "::error::expected git am to stop at a conflict"; exit 1; }
          echo "Conflicted files:"; git diff --name-only --diff-filter=U

      - name: Give Gemini the repo background
        if: env.HAS_KEY == 'true'
        # Gemini CLI loads GEMINI.md from its working directory as context.
        run: cp overlay/AGENTS.md GEMINI.md

      - name: Ask Gemini to resolve the conflict
        if: env.HAS_KEY == 'true'
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          # The throwaway CI checkout is the workspace Gemini is meant to edit.
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Read ./overlay/AGENTS.md first: it explains this repo and the DAI patch.

            The directory ./upstream is a checkout of the FastChannels repository. A
            patch that adds an opt-in "DirecTV ad insertion (DAI)" feature no longer
            applies cleanly: `git am --3way` stopped with conflict markers
            (<<<<<<< ======= >>>>>>>) in the files listed by
            `git -C upstream diff --name-only --diff-filter=U`. The patch being
            applied is ./upstream/.git/rebase-apply/patch.

            Resolve every conflict in those files. Rules:
            - The result must be upstream's current code plus exactly the behavior the
              patch adds. Read the whole patch first so you understand what it does.
            - Keep every upstream change. If upstream renamed or restructured code the
              patch relies on, adapt the patch's code to the new structure.
            - Edit only the conflicted files, and only what the conflicts require.
              Don't refactor, reformat or change anything else.
            - Leave no conflict markers. `python3 -m compileall -q upstream/app` must
              succeed.
            - Only edit files. Don't run git commands that change the index or
              history (no add, commit, am, reset, checkout or push).

      - name: Check the result and finish the merge
        if: env.HAS_KEY == 'true'
        run: |
          cd upstream
          conflicted=$(git diff --name-only --diff-filter=U)
          [ -n "$conflicted" ] || { echo "::error::no conflicted files recorded"; exit 1; }
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' $conflicted; then
            echo "::error::conflict markers remain after Gemini's pass"; exit 1
          fi
          stray=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -vxF -f <(printf '%s\n' $conflicted) | grep -v '^\.gemini/' || true)
          [ -z "$stray" ] || { echo "::error::Gemini changed files outside the conflict: $stray"; exit 1; }
          git add -- $conflicted
          GIT_EDITOR=true git am --continue

      - name: Set up Python
        if: env.HAS_KEY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static checks
        if: env.HAS_KEY == 'true'
        env:
          UPSTREAM_SHA: ${{ needs.build.outputs.sha }}
        run: |
          pip install --quiet ruff jinja2
          overlay/scripts/validate.sh upstream

      - name: Export the ported patch
        if: env.HAS_KEY == 'true'
        run: overlay/scripts/refresh-patches.sh upstream "${{ needs.build.outputs.sha }}"

      - name: Upload the ported patch
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ported-patches
          path: overlay/patches/

  open-pr:
    needs: [build, resolve]
    if: always() && needs.build.outputs.conflict == 'true' && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5

      - name: Download the ported patch
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ported-patches
          path: ported

      - name: Open a pull request
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.build.outputs.short }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          branch="auto/port-$SHORT"
          rm -f patches/*.patch
          cp ported/*.patch patches/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A patches
          git commit -q -m "Port patches to upstream $SHORT (conflict resolved by Gemini)"
          git push -f origin "$branch"
          issue=$(gh issue list --state open --search 'in:title "Patches no longer apply to upstream"' --json number --jq '.[0].number')
          body=$(cat <<BODY
          Upstream moved to [\`$SHORT\`](https://github.com/$UPSTREAM_REPO/commit/$SHA) and the patch conflicted. Gemini resolved the conflict, changing only the conflicted files, and the result passed the static checks: compile, no new ruff errors, templates parse, DAI code present.

          This PR is merged automatically, which starts the full build: image, Player APK check, DAI smoke test and boot test. \`:latest\` only updates if all of them pass.

          ${issue:+Refs #$issue}
          BODY
          )
          title="Port patches to upstream $SHORT"
          [ "$TEST_RUN" != true ] || title="[test run, don't merge] $title"
          pr=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
          [ -n "$pr" ] || pr=$(gh pr create --head "$branch" --base main --title "$title" --body "$body")
          echo "Opened $pr"
          if [ "$TEST_RUN" = true ]; then
            echo "Test run: leaving the PR open and publishing nothing."
            exit 0
          fi
          # Merge it and start a normal build. That build runs every check (image,
          # APK, smoke test, boot test) and only publishes if all of them pass.
          # workflow_dispatch is used because pushes made with GITHUB_TOKEN don't
          # trigger workflows.
          gh pr merge "$pr" --squash --delete-branch
          gh workflow run build.yml --ref main
          echo "Merged $pr and started the publishing build."
