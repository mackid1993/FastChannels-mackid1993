name: Model preflight

# One-off sanity check: does the configured AI_MODEL actually answer through
# OpenRouter under THIS account's privacy/data policies, using the same secret the
# conflict/drift resolver uses? Run it from the Actions tab (Run workflow) after
# changing AI_MODEL, before trusting the auto-fix. Costs a few tokens.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Call AI_MODEL through OpenRouter with the resolver's key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openrouter/z-ai/glm-5.3-flash' }}
        run: |
          [ -n "$OPENROUTER_API_KEY" ] || { echo "::error::OPENROUTER_API_KEY secret is not set"; exit 1; }
          # Aider routes with an "openrouter/" prefix; the raw API wants just the model id.
          model="${AI_MODEL#openrouter/}"
          echo "Testing model '$model' under this account's OpenRouter data policies..."
          # Generous max_tokens: reasoning models (e.g. GLM 5.3 Flash) spend tokens
          # thinking before any visible content, so a tiny budget yields empty content.
          code=$(curl -sS -o resp.json -w '%{http_code}' https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly: OK\"}],\"max_tokens\":2048}")
          echo "HTTP $code"
          content=$(jq -r '.choices[0].message.content // empty' resp.json 2>/dev/null)
          provider=$(jq -r '.provider // empty' resp.json 2>/dev/null)
          finish=$(jq -r '.choices[0].finish_reason // empty' resp.json 2>/dev/null)
          usage=$(jq -rc '.usage // empty' resp.json 2>/dev/null)
          err=$(jq -r '(.error.message // .error) // empty' resp.json 2>/dev/null)
          echo "provider routed: ${provider:-（none）}"
          echo "finish_reason: ${finish:-（none）}   usage: ${usage:-（none）}"
          echo "content: ${content:-（none）}"
          [ -n "$err" ] && echo "error: $err"
          if [ "$code" != "200" ] || [ -z "$content" ]; then
            echo "::error::'$model' did not return a usable completion (HTTP $code). Most likely your OpenRouter privacy/data policy blocks every provider for this model, or the id is wrong. Allow a provider for it, or pick a different model, then re-run."
            exit 1
          fi
          echo "::notice::OK — '$model' answered through OpenRouter under the current privacy policies (provider: ${provider:-unknown})."

      - name: Show the model's context window per provider
        # The AI repair sends the overlay's files, its tests and the failure log in one
        # request; if that's longer than the model's context window, OpenRouter silently
        # drops the middle ("middle-out") and the model never sees the files.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openrouter/z-ai/glm-5.3-flash' }}
        run: |
          model="${AI_MODEL#openrouter/}"
          curl -sS "https://openrouter.ai/api/v1/models/$model/endpoints" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" -o endpoints.json
          jq -r '.data.endpoints[]? | "\(.provider_name): context \(.context_length), max output \(.max_completion_tokens // "?")"' endpoints.json \
            || head -c 500 endpoints.json
