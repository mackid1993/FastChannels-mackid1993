name: Model preflight

# One-off sanity check: does the configured AI_MODEL actually answer, with the key the
# conflict/drift repair uses, keep earlier messages in a long request (what Aider relies on:
# the files go in earlier messages, the task in the last one), and edit a file through Aider
# exactly as the repair calls it? Run it from the Actions tab after changing AI_MODEL.
# Costs a few cents at most.
#
# AI_MODEL "anthropic/<id>" (default, Claude Haiku 5.5) uses ANTHROPIC_API_KEY against
# Anthropic's API; "openrouter/<id>" uses OPENROUTER_API_KEY with the same provider routing
# the repair uses (scripts/openrouter_provider.py).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Call AI_MODEL with the repair's key (short and long requests)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'anthropic/claude-haiku-5-5' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request
          sys.path.insert(0, 'scripts')
          from openrouter_provider import is_anthropic, key_var, provider

          model = os.environ['AI_MODEL']
          var = key_var(model)
          key = os.environ.get(var, '')
          if not key:
              print(f'::error::{var} secret is not set (needed for {model})'); sys.exit(1)
          anth = is_anthropic(model)
          mid = model.split('/', 1)[1] if model.startswith(('anthropic/', 'openrouter/')) else model
          print(f'Model: {model}  via {"Anthropic" if anth else "OpenRouter"} ({var})')

          def call(messages, system='You are a helpful assistant.'):
              if anth:
                  body = {'model': mid, 'max_tokens': 2048, 'system': system, 'messages': messages}
                  req = urllib.request.Request('https://api.anthropic.com/v1/messages',
                      data=json.dumps(body).encode(),
                      headers={'x-api-key': key, 'anthropic-version': '2023-06-01',
                               'content-type': 'application/json'})
              else:
                  body = {'model': mid, 'max_tokens': 2048, 'provider': provider(),
                          'messages': [{'role': 'system', 'content': system}, *messages]}
                  req = urllib.request.Request('https://openrouter.ai/api/v1/chat/completions',
                      data=json.dumps(body).encode(),
                      headers={'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json'})
              try:
                  r = json.load(urllib.request.urlopen(req, timeout=180))
              except urllib.error.HTTPError as e:
                  return '', f'HTTP {e.code}: {e.read()[:300]!r}', {}
              if anth:
                  text = ''.join(b.get('text', '') for b in r.get('content') or [] if b.get('type') == 'text')
                  return text, r.get('model', '?'), r.get('usage') or {}
              text = r['choices'][0]['message'].get('content') or ''
              return text, r.get('provider', '?'), r.get('usage') or {}

          text, who, usage = call([{'role': 'user', 'content': 'Reply with exactly: OK'}])
          print(f'basic: {text.strip()[:40]!r}  ({who})  usage={usage}')
          if 'OK' not in text:
              print(f'::error::{model} did not return a usable completion: {who}'); sys.exit(1)

          ok = True
          for k in (1, 30, 70, 120):
              filler = '\n'.join(f'def helper_{i}(x):\n    return x + {i}\n' for i in range(k * 1000 // 14))
              text, who, usage = call([
                  {'role': 'user', 'content': 'Remember this code word for later: PINEAPPLE-4217. Reply only OK.'},
                  {'role': 'assistant', 'content': 'OK'},
                  {'role': 'user', 'content': 'Here is a file:\n```\n' + filler + '\n```'},
                  {'role': 'assistant', 'content': 'Noted.'},
                  {'role': 'user', 'content': 'What was the code word I gave you earlier? Reply with just the code word.'}])
              got = 'PINEAPPLE-4217' in text
              ok = ok and got
              tokens = usage.get('input_tokens') or usage.get('prompt_tokens') or '?'
              print(f'~{k}k padding: {"OK  " if got else "LOST"} input_tokens={tokens} ({who}) answer={text.strip()[:80]!r}')
          if not ok:
              print('::error::the model lost earlier messages; the AI repair would not see the files'); sys.exit(1)
          print(f'::notice::OK: {model} answers and keeps earlier messages up to ~120k tokens.')
          PY

      - name: The same model through Aider (exactly as the repair calls it)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'anthropic/claude-haiku-5-5' }}
        run: |
          pip install --quiet aider-chat==0.86.2
          mkdir -p /tmp/aidercheck && cd /tmp/aidercheck
          printf 'def greet():\n    return "hello"\n' > greet.py
          python3 "$GITHUB_WORKSPACE/scripts/openrouter_provider.py" aider "$AI_MODEL" > settings.json
          aider --model "$AI_MODEL" --model-settings-file settings.json \
                --edit-format diff --yes-always --no-git --no-auto-commits --no-auto-lint \
                --no-auto-test --no-suggest-shell-commands --no-detect-urls \
                --no-show-model-warnings --no-check-update --no-analytics --no-pretty --map-tokens 0 \
                --message 'In greet.py, change the returned string from "hello" to "hello world". Change nothing else.' \
                greet.py
          cat greet.py
          grep -q 'hello world' greet.py \
            || { echo "::error::Aider with $AI_MODEL did not make the edit"; exit 1; }
          echo "::notice::OK: Aider edited a file with $AI_MODEL."
