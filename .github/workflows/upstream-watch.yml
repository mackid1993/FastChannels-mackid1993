name: Upstream watch (development)

# Watches kineticman/FastChannels' DEVELOPMENT branch so the AGENT fixes drift early —
# you never touch anything.
#
# GitHub can't notify us of pushes to a repo we don't own, so we poll every 6 hours.
# On a new development commit (deduped via the Actions cache, so the agent is invoked
# at most once per commit), dispatch the build workflow in drift-check mode against
# development:
#
#     build.yml  upstream_branch=development  drift_only=true
#
# In that mode build.yml applies the patches to development and runs the static checks
# (no image, no publish — it's a "test run"). If the patch drifts/conflicts, the Claude Haiku 5.5
# resolver adapts it and opens a HELD pull request (branch auto/drift-<short>)
# labelled with the development commit it fixes. Nothing is built, published, or merged
# here, so it can never touch :latest.
#
# The held PR is the agent's prepared fix. The reconcile workflow (reconcile-drift.yml)
# then auto-merges it the moment it's proven correct against main, and publishes — all
# hands-off. The notification on the PR is FYI only; there is never anything for you to do.

on:
  schedule:
    - cron: "30 */6 * * *"   # every 6h, offset 30 min from build.yml's main watch
  workflow_dispatch:

permissions:
  actions: write              # to dispatch build.yml
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

env:
  UPSTREAM_REPO: kineticman/FastChannels
  UPSTREAM_BRANCH: development

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Read development HEAD
        id: head
        run: |
          sha=$(git ls-remote "https://github.com/$UPSTREAM_REPO.git" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)
          [ -n "$sha" ] || { echo "::error::could not read upstream $UPSTREAM_BRANCH"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Upstream $UPSTREAM_BRANCH HEAD: $sha"

      - name: Already invoked the agent for this commit?
        id: seen
        uses: actions/cache@v4
        with:
          path: .dev-watch-marker
          key: dev-watch-v2-${{ steps.head.outputs.sha }}

      - name: Dispatch a drift check against development (agent fixes on drift)
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "New $UPSTREAM_BRANCH commit ${{ steps.head.outputs.sha }} — running a drift check; the agent fixes it if it drifts."
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" -f upstream_branch="$UPSTREAM_BRANCH" -f drift_only=true
          # The full image test (smoke + boot) on the same commit; test only, no AI.
          gh workflow run test-development.yml --repo "$GITHUB_REPOSITORY" -f upstream_ref="${{ steps.head.outputs.sha }}"
          # Mark seen only after a successful dispatch, so a failed dispatch is retried.
          mkdir -p .dev-watch-marker
          echo "${{ steps.head.outputs.sha }}" > .dev-watch-marker/sha

      - name: Nothing new
        if: steps.seen.outputs.cache-hit == 'true'
        run: echo "$UPSTREAM_BRANCH unchanged since the last check (${{ steps.head.outputs.sha }}); nothing to do."
